name: Changelog guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, closed]
  push:
    branches: [main, master]
    paths: [CHANGELOG.md]

permissions: {}

concurrency:
  # closed and edited runs get their own group so they never cancel a check that is still going
  group: changelog-guard-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'closed' || github.event.action == 'edited') && format('-{0}', github.event.action) || '' }}
  cancel-in-progress: true

jobs:
  pr:
    name: Check CHANGELOG.md
    # an edit only matters when it retargets the PR
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # list open PRs and this PR's labels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Self-test
        run: python3 .github/scripts/changelog_guard_test.py
      - name: Run changelog guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: pr
          BASE: origin/${{ github.base_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/changelog_guard.py

  recheck:
    name: Recheck open PRs
    # a release or merged entry moves the base; a peer's push, reopen, retarget, merge or close can
    # add or remove a collision for the higher-numbered PRs
    if: >-
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      contains(fromJSON('["synchronize", "reopened", "closed"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # list open PRs
      actions: write # re-run each affected PR's own changelog check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Re-run the check on affected open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ github.event_name == 'push' && 'recheck' || 'peers' }}
          BASE: ${{ github.event_name == 'push' && github.sha || format('origin/{0}', github.event.pull_request.base.ref) }}
          BASE_BRANCH: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.base.ref }}
          PEER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/changelog_guard.py
      - name: Re-run the check on open PRs into the branch the PR left
        if: github.event.action == 'edited' && github.event.changes.base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: peers
          BASE: origin/${{ github.event.changes.base.ref.from }}
          BASE_BRANCH: ${{ github.event.changes.base.ref.from }}
          PEER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/changelog_guard.py
