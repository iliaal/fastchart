name: Release Linux & macOS binaries

# Release/manual runs build .so binaries for Linux glibc (x86_64 + arm64)
# and macOS arm64 at PHP 8.4 and 8.5 (NTS only, ZTS lives in the Windows
# lane). A path-filtered pull request run exercises one representative
# Linux/PHP 8.4 static-codec build before the release exists. Release and
# manual matrix slots package their binaries; only a release event uploads
# them using PIE's pre-packaged-binary naming convention.
#
# Each binary compiles against the OLDEST patch release of its PHP minor
# (8.4.1, since 8.4.0 was never released, and 8.5.0). PHP promises only that a
# module built on an older patch loads on a newer one: 8.4.27 and 8.5.12
# route the inline smart_str_alloc() through the new smart_str_ferealloc()
# export, so a module compiled against their headers dies with "undefined
# symbol" on every earlier patch. Linux builds inside the digest-pinned
# official php:<oldest>-cli-bookworm image, which also holds the glibc floor
# at bookworm's 2.36; macOS builds PHP from the checksum-pinned php.net
# tarball, because setup-php installs only the newest patch. Before a binary
# is packaged, every symbol a Linux .so imports must be exported by the
# oldest patch's php binary or a library it links, and every binary must
# load and render an SVG large enough to grow its smart_str on both the
# oldest and the newest patch (scripts/prebuilt-abi-smoke.sh/.php).
#
# Linux build statically links the four codec deps (freetype, libpng,
# libjpeg-turbo, libwebp). Otherwise the resulting .so picks up the
# build host's soname for libjpeg (libjpeg.so.8 on Ubuntu, .so.62 on
# Debian) and fails to load on the other lineage. The official
# php:X.Y-cli Docker images are Debian-based; an .so.8-linked prebuilt
# fails there with "libjpeg.so.8: cannot open shared object file".
# Static linking eliminates all codec-lib NEEDED entries from the
# produced .so; only libc / libm / libpthread / libz remain dynamic.
# Trade: +~4min per build slot (cacheable; see Cache step below);
# .so grows from ~4MB to ~10MB.
#
# macOS keeps the brew-installed dynamic libs. The Mach-O linker
# resolves by install-name (absolute path baked into the .dylib at
# build time), not by soname major, so the same compat issue doesn't
# manifest. Homebrew lives at /opt/homebrew on Apple Silicon; the
# prebuilt's install-name entries point there.
#
# 8.3 is intentionally absent: PIE's composer-default fallback
# source-builds for any PHP version not covered by a prebuilt, so 8.3
# users still get an install path; it just requires a build toolchain.
# Drop the 8.4 lane when 8.4 hits actual EOL.
#
# macOS Intel (macos-13) is intentionally absent: GitHub's Intel runner
# pool is too contended to ship reliably, and macOS 26 drops Intel
# support anyway.
#
# Linux musl (Alpine) is intentionally absent: shivammathur/setup-php
# in Alpine containers needs more setup, and Alpine users get install
# via PIE's composer-default source-build fallback in the meantime.
#
# composer.json declares
#   "download-url-method": ["pre-packaged-binary", "composer-default"]
# in the php-ext block, so PIE prefers the prebuilt asset and falls
# back to source-build when no asset matches.
#
# Third-party actions are pinned to commit SHAs. Only the final upload job
# receives contents:write.

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/release-linux.yml'
      - 'config.m4'
      - 'fastchart*.c'
      - 'fastchart*.h'
      - 'vendor/**'
      - 'scripts/build-linux-prebuilt.sh'
      - 'scripts/prebuilt-abi-smoke.*'
  release:
    types: [published]
  # workflow_dispatch lets a maintainer re-run the prebuilt build
  # without cutting a fresh release tag, for example to validate
  # static-link changes to release-linux.yml itself before publishing.
  # The release step is gated on github.event_name == 'release' so a
  # manual run produces artifacts (visible in the run summary) but
  # does not upload to a release.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-linux-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

# Pin the codec lib versions in one place. Bumping a version here
# invalidates the static-deps cache key automatically.
env:
  FT_VERSION: '2.13.3'
  PNG_VERSION: '1.6.43'
  JPEG_VERSION: '3.0.4'
  WEBP_VERSION: '1.4.0'
  FT_SHA256: '0550350666d427c74daeb85d5ac7bb353acba5f76956395995311a9c6f063289'
  PNG_SHA256: 'e804e465d4b109b5ad285a8fb71f0dd3f74f0068f91ce3cdfde618180c174925'
  JPEG_SHA256: '99130559e7d62e8d695f2c0eaeef912c5828d5b84a0537dcb24c9678c9d5b76b'
  WEBP_SHA256: '61f873ec69e3be1b99535634340d5bde750b2e4447caa1db9f61be3fd49ab1e5'
  # Oldest patch of each minor: php.net tar.xz SHA-256 for the macOS build,
  # and the official bookworm image (multi-arch index digest) the Linux
  # build runs in. NEWEST_* is the image the gate also loads each Linux
  # binary on; move it to each new patch release.
  PHP84_OLDEST: '8.4.1'
  PHP84_OLDEST_SHA256: '94c8a4fd419d45748951fa6d73bd55f6bdf0adaefb8814880a67baa66027311f'
  PHP84_OLDEST_IMAGE: 'php:8.4.1-cli-bookworm@sha256:246d2ca7e9cf21c4e7c354ce87e87bf1ad6d41b2061c77668845e04a8f8889d4'
  PHP84_NEWEST_IMAGE: 'php:8.4.27-cli@sha256:debadc2e36b857657846e2e952cbaf52702e55482dd3c2c43806f68d8c534a70'
  PHP85_OLDEST: '8.5.0'
  PHP85_OLDEST_SHA256: '39cb6e4acd679b574d3d3276f148213e935fc25f90403eb84fb1b836a806ef1e'
  PHP85_OLDEST_IMAGE: 'php:8.5.0-cli-bookworm@sha256:4ff93cd1b053c4d5ff468ced40962092a350a8c86798fee96e807bc9b383ec75'
  PHP85_NEWEST_IMAGE: 'php:8.5.12-cli@sha256:635a4b998025ab269194639a5549c6fdcd9b4f88ec8cd761b092de8653d40663'

jobs:
  build:
    name: ${{ matrix.os }} php ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 (x86_64), ubuntu-24.04-arm (arm64),
        # macos-15 (Apple Silicon arm64). Pinned over `*-latest` to
        # avoid silent runner shifts that would change the toolchain /
        # glibc baseline on published release assets without a repo diff.
        # Pull requests run only the representative x86_64/PHP 8.4 slot;
        # release and manual events retain the full 3x2 matrix.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","ubuntu-24.04-arm","macos-15"]') }}
        php: ${{ fromJSON(github.event_name == 'pull_request' && '["8.4"]' || '["8.4","8.5"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select oldest-patch pins
        env:
          MATRIX_PHP: ${{ matrix.php }}
        run: |
          set -euo pipefail
          case "$MATRIX_PHP" in
            8.4) oldest=$PHP84_OLDEST sha=$PHP84_OLDEST_SHA256 old_img=$PHP84_OLDEST_IMAGE new_img=$PHP84_NEWEST_IMAGE ;;
            8.5) oldest=$PHP85_OLDEST sha=$PHP85_OLDEST_SHA256 old_img=$PHP85_OLDEST_IMAGE new_img=$PHP85_NEWEST_IMAGE ;;
            *) echo "::error::no oldest-patch pin for PHP $MATRIX_PHP"; exit 1 ;;
          esac
          {
            echo "PHP_OLDEST=$oldest"
            echo "PHP_OLDEST_SHA256=$sha"
            echo "OLDEST_IMAGE_REF=$old_img"
            echo "NEWEST_IMAGE_REF=$new_img"
          } >> "$GITHUB_ENV"

      # The newest patch of the minor. It runs the existing smoke test below;
      # the binary itself is compiled against the oldest patch.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install host packaging tools (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zip

      # Anonymous pulls from shared runner IPs hit both Docker Hub's and ECR
      # Public's per-IP limits. ECR Public mirrors the official images under
      # the same digests, so either source yields the pinned image.
      - name: Pull the oldest and newest patch images (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          set -euo pipefail
          pull() {
            local delay reg
            for delay in 10 30 60 0; do
              for reg in public.ecr.aws/docker/library docker.io/library; do
                if docker pull -q "$reg/$2" > /dev/null; then
                  echo "$1=$reg/$2" >> "$GITHUB_ENV"
                  docker image inspect --format "$1: {{index .RepoDigests 0}}" "$reg/$2"
                  return 0
                fi
              done
              [ "$delay" -gt 0 ] || return 1
              sleep "$delay"
            done
          }
          pull OLDEST_IMAGE "$OLDEST_IMAGE_REF"
          pull NEWEST_IMAGE "$NEWEST_IMAGE_REF"

      # The codec libs and the extension both build inside the oldest-patch
      # image, so the .so sees that patch's headers and bookworm's glibc.
      - name: Build prebuilt binary against the oldest patch (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          set -euo pipefail
          docker run --pull never --rm \
            -e FT_VERSION -e FT_SHA256 -e PNG_VERSION -e PNG_SHA256 \
            -e JPEG_VERSION -e JPEG_SHA256 -e WEBP_VERSION -e WEBP_SHA256 \
            -e HOST_OWNER="$(id -u):$(id -g)" \
            -v "$PWD:/src" -w /src "$OLDEST_IMAGE" \
            bash -c 'trap "chown -R \"\$HOST_OWNER\" /src" EXIT; scripts/build-linux-prebuilt.sh "$1"' \
            build "$PHP_OLDEST"

      - name: Install build deps (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: |
          brew install autoconf freetype libpng jpeg-turbo webp pkg-config
          # Apple Silicon Homebrew lives under /opt/homebrew; expose
          # the pkg-config dirs so config.m4's PKG_CHECK_MODULES sees
          # the kegs. jpeg-turbo and freetype are keg-only, so brew
          # doesn't symlink their .pc into the default search path.
          {
            echo "PKG_CONFIG_PATH=$(brew --prefix jpeg-turbo)/lib/pkgconfig:$(brew --prefix freetype)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          } >> "$GITHUB_ENV"

      # Kept off PATH: phpize and php-config are called by absolute path,
      # and `php` stays setup-php's newest patch for the smoke test.
      - name: Build oldest-patch PHP from the release tarball (macOS)
        if: startsWith(matrix.os, 'macos-')
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/php-$PHP_OLDEST.tar.xz"
          curl -fsSL --retry 3 -o "$tarball" "https://www.php.net/distributions/php-$PHP_OLDEST.tar.xz"
          echo "$PHP_OLDEST_SHA256  $tarball" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/php-src"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/php-src" --strip-components=1
          cd "$RUNNER_TEMP/php-src"
          ./configure --prefix="$RUNNER_TEMP/php-oldest" --disable-all --enable-cli \
            --disable-cgi --disable-phpdbg --without-pear > "$RUNNER_TEMP/php-configure.log"
          make -j"$(sysctl -n hw.ncpu)" > "$RUNNER_TEMP/php-make.log" 2>&1 \
            || { tail -50 "$RUNNER_TEMP/php-make.log"; exit 1; }
          make install > /dev/null
          test "$("$RUNNER_TEMP/php-oldest/bin/php-config" --version)" = "$PHP_OLDEST"
          test "$("$RUNNER_TEMP/php-oldest/bin/php" -n -r 'echo PHP_VERSION, (int) PHP_ZTS, (int) PHP_DEBUG;')" = "${PHP_OLDEST}00"

      - name: Build prebuilt binary against the oldest patch (macOS)
        if: startsWith(matrix.os, 'macos-')
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          set -e
          "$RUNNER_TEMP/php-oldest/bin/phpize"
          ./configure --with-php-config="$RUNNER_TEMP/php-oldest/bin/php-config" \
            --enable-fastchart --enable-fastchart-dev
          make -j"$(sysctl -n hw.ncpu)"
          find modules -maxdepth 1 -type f -print

      - name: Inspect macOS binary compatibility
        if: runner.os == 'macOS'
        run: |
          lipo modules/fastchart.so -verify_arch arm64
          otool -l modules/fastchart.so
          otool -L modules/fastchart.so
          otool -L modules/fastchart.so | awk '$1 ~ /^\/opt\/homebrew\// {print $1}' |
            while IFS= read -r dependency; do
              printf '%s\n' "$dependency"
              otool -l "$dependency" | awk '/LC_BUILD_VERSION/,/ntools/; /LC_VERSION_MIN_MACOSX/,/sdk/'
            done

      - name: Verify codec libs are static (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          SO="$PWD/modules/fastchart.so"
          test -f "$SO"
          echo "Inspecting $SO ($(stat -c '%s' "$SO") bytes)"
          echo "--- NEEDED entries ---"
          readelf -d "$SO" > "$RUNNER_TEMP/fastchart-dynamic.txt"
          grep NEEDED "$RUNNER_TEMP/fastchart-dynamic.txt" || true
          echo "--- assertion ---"
          if grep NEEDED "$RUNNER_TEMP/fastchart-dynamic.txt" | grep -iE "libjpeg|libpng|libwebp|libfreetype" > /dev/null; then
            echo "FAIL: codec libs still appear in NEEDED; static link did not take"
            exit 1
          fi
          echo "OK: codec libs are statically linked into fastchart.so"

      # Load-test the produced binary (Linux + macOS). readelf/NEEDED
      # inspection above proves the codecs are statically linked but
      # never dlopens the object or renders a pixel, and a .so that loads
      # readelf-clean can still abort at MINIT or crash the encoder.
      # This runs on the same fastchart.so that the later packaging step
      # archives. Renders PNG/JPEG/WebP from a titled
      # LineChart and a QrCode, then validates each with
      # getimagesizefromstring (header-parse only, no ext/gd needed for
      # PNG/JPEG/WebP) asserting exact dimensions and non-trivial length.
      # No PDF render: release binaries are built without --with-pdfio.
      - name: Smoke-test built binary (load + render + decode)
        run: |
          set -e
          SO="$PWD/modules/fastchart.so"
          test -f "$SO"
          echo "Smoke-testing $SO"
          cat > "$RUNNER_TEMP/release-smoke.php" <<'PHP'
          <?php
          function fail(string $m): void { fwrite(STDERR, "SMOKE FAIL: $m\n"); exit(1); }

          $v = FastChart\Chart::version();
          if (!is_string($v) || $v === '') { fail('version() returned empty'); }
          echo "fastchart version: $v\n";

          $line = (new FastChart\LineChart(400, 300))
              ->setTitle('Release Smoke')
              ->setSeries([1, 3, 2, 5, 4, 6]);
          $qr = (new FastChart\QrCode())
              ->setData('https://github.com/iliaal/fastchart')
              ->setSize(240, 240);

          $checks = [
              'line-png'  => [$line->renderPng(),  400, 300, 'png'],
              'line-jpeg' => [$line->renderJpeg(), 400, 300, 'jpeg'],
              'line-webp' => [$line->renderWebp(), 400, 300, 'webp'],
              'qr-png'    => [$qr->renderPng(),    240, 240, 'png'],
              'qr-jpeg'   => [$qr->renderJpeg(),   240, 240, 'jpeg'],
              'qr-webp'   => [$qr->renderWebp(),   240, 240, 'webp'],
          ];

          foreach ($checks as $name => [$bytes, $ew, $eh, $fmt]) {
              if (!is_string($bytes) || strlen($bytes) < 128) {
                  fail("$name: output too small (" . strlen((string) $bytes) . " bytes)");
              }
              $info = getimagesizefromstring($bytes);
              if ($info === false) {
                  fail("$name: getimagesizefromstring rejected the $fmt output");
              }
              if ($info[0] !== $ew || $info[1] !== $eh) {
                  fail("$name: dims {$info[0]}x{$info[1]} != expected {$ew}x{$eh}");
              }
              printf("OK %-9s %-4s %dx%d %d bytes\n", $name, $fmt, $info[0], $info[1], strlen($bytes));
          }
          echo "release smoke passed\n";
          PHP
          php -d extension="$SO" "$RUNNER_TEMP/release-smoke.php"

      - name: Gate on the oldest and newest patch (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          scripts/prebuilt-abi-smoke.sh "$PWD/modules/fastchart.so" "$OLDEST_IMAGE" "$NEWEST_IMAGE"

      # The macOS module uses flat-namespace lookup and the system libraries
      # live in the dyld cache, so nm cannot attribute its imports; loading it
      # into the oldest-patch build PHP and setup-php's newest patch covers
      # both ends.
      - name: Gate on the oldest and newest patch (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: |
          # GitHub runs bash with -e; a failed load must still print its
          # output and fall through to the status checks.
          set +e
          set -uo pipefail
          module="$PWD/modules/fastchart.so"
          status=0
          for php_bin in "$RUNNER_TEMP/php-oldest/bin/php" "$(command -v php)"; do
            want=$("$php_bin" -n -r 'echo PHP_VERSION;')
            echo "== load and smoke on $php_bin (PHP $want)"
            out=$("$php_bin" -n -d extension="$module" scripts/prebuilt-abi-smoke.php 2>&1)
            rc=$?
            printf '%s\n' "$out"
            if [[ $rc -ne 0 ]]; then
              echo "::error::smoke on PHP $want exited with status $rc"
              status=1
            elif grep -qiE 'symbol not found|undefined symbol' <<< "$out"; then
              echo "::error::smoke on PHP $want reported an unresolved symbol"
              status=1
            elif ! grep -qF "ok php=$want " <<< "$out"; then
              echo "::error::smoke on PHP $want did not report PHP $want"
              status=1
            fi
          done
          if [[ "$("$RUNNER_TEMP/php-oldest/bin/php" -n -r 'echo PHP_VERSION;')" == "$(php -n -r 'echo PHP_VERSION;')" ]]; then
            echo "::error::setup-php and the oldest-patch build report the same PHP version"
            status=1
          fi
          exit "$status"

      - name: Package verified binary
        if: github.event_name != 'pull_request'
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          set -e
          TAG="${RELEASE_TAG:-validation-${GITHUB_SHA::12}}"
          PHP_MM=$(php-config --version | cut -d. -f1,2)
          case "$MATRIX_OS" in
            ubuntu-24.04) TARGET='x86_64-linux-glibc' ;;
            ubuntu-24.04-arm) TARGET='arm64-linux-glibc' ;;
            macos-15) TARGET='arm64-darwin-bsdlibc' ;;
            *) echo "::error::unsupported package target: $MATRIX_OS"; exit 1 ;;
          esac
          PACKAGE="php_fastchart-${TAG}_php${PHP_MM}-${TARGET}.zip"
          zip -j "$PACKAGE" modules/fastchart.so
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Stage verified binary
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-${{ matrix.os }}-php${{ matrix.php }}
          path: ${{ steps.package.outputs.package }}
          if-no-files-found: error
          retention-days: 7

  upload-release:
    name: Upload verified release binaries
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # Uploads the verified binary set to the release.
    steps:
      - name: Download verified binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuilt-*
          path: release-assets
          merge-multiple: true

      - name: Verify release asset set
        run: |
          set -e
          count=$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)
          if [ "$count" -ne 6 ]; then
            echo "::error::expected 6 verified release archives, found $count"
            find release-assets -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.zip --repo "$GITHUB_REPOSITORY" --clobber
