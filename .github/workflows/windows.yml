name: Windows Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

jobs:
  windows-matrix:
    name: Generate Windows build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        # Pinned to the commit SHA that v1 currently resolves to:
        # mutable @v1 is a supply-chain risk for a workflow that has
        # contents:write on the release job. Re-resolve on upstream
        # bumps via: gh api repos/php/php-windows-builder/git/refs/tags/v1
        uses: php/php-windows-builder/extension-matrix@e03e5d39879adaeb61ed2225f0f4eae7db8c1df8 # v1
        with:
          extension-url: ${{ github.event.repository.html_url }}
          php-version-list: '8.1, 8.2, 8.3, 8.4, 8.5'

  windows-build:
    name: Build ${{ matrix.php-version }} ${{ matrix.arch }} ${{ matrix.ts }}
    needs: windows-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.windows-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Build extension
        uses: php/php-windows-builder/extension@e03e5d39879adaeb61ed2225f0f4eae7db8c1df8 # v1
        env:
          # tests/_font_candidates.inc only knows Linux font paths; the
          # FC_FONT escape hatch points the ~12 font-gated phpts at a
          # font every Windows runner ships.
          FC_FONT: C:\Windows\Fonts\arial.ttf
        with:
          php-version: ${{ matrix.php-version }}
          ts: ${{ matrix.ts }}
          arch: ${{ matrix.arch }}
          # The action's test step runs php.exe with `-n` plus only the
          # built fastchart.dll, so the ~90 gd round-trip phpts SKIP.
          # test-runner-args REPLACES the action's defaults (first 8
          # tokens below reproduce them) — the extra -d loads the
          # php_gd.dll bundled in the official Windows test build the
          # action stages under <workspace>\php-bin, turning the raster
          # decode coverage on for every Windows lane.
          test-runner-args: >-
            -d open_basedir= -d output_buffering=0 -q --offline --show-diff
            --show-slow 1000 --set-timeout 120 -g FAIL,XFAIL,BORK,WARN,LEAK,SKIP
            -d extension=${{ github.workspace }}\php-bin\ext\php_gd.dll
          # --enable-fastchart-dev turns MSVC warnings into errors (/WX,
          # config.w32:113-117), matching the -Werror bar the Unix lanes
          # hold. This workflow also feeds release publishing (the
          # `release` job below fires on release:published), so /WX now
          # gates release DLLs too: a warning-bearing DLL fails the build
          # and never publishes. That is intended.
          args: --enable-fastchart --enable-fastchart-dev
          # Four pkg-config deps fastchart's config.m4 probes for. The
          # action wires these into the Windows build's vcpkg sysroot so
          # config.m4's PKG_CHECK_MODULES calls resolve. plutovg /
          # plutosvg / qrcodegen are vendored under vendor/ and don't
          # need an entry here.
          libs: freetype,libpng,libjpeg-turbo,libwebp

  # EXPERIMENTAL — single representative lane that compiles the MSVC PDF
  # path (fastchart_pdf.c, gated by --with-fastchart-pdfio in config.w32).
  # No other Windows job exercises it, so without this lane fastchart_pdf.c
  # never compiles on MSVC. pdfio is NOT a php-sdk dependency, so it is
  # built from source with MSVC and staged into the SDK deps layout by
  # hand. That hand-wiring CANNOT be validated locally and is expected to
  # need a CI round or two to settle — specifically:
  #   * the exact deps-prefix path config.w32's PHP_PHP_BUILD resolves to,
  #   * pdfio.vcxproj's output names / dirs at the pinned tag,
  #   * runtime discovery of pdfio1.dll when loading php_fastchart.dll,
  #   * whether the runner exposes a usable font for the PDF text render.
  # Kept continue-on-error so an unresolved detail yields a yellow lane
  # (with the compile log visible) rather than reding the release matrix.
  # Drop continue-on-error once it goes green. Not part of release
  # publishing — this lane builds a --with-fastchart-pdfio DLL that the
  # release job intentionally does not upload (release DLLs are pdfio-less,
  # matching the Linux prebuilt).
  windows-pdf:
    name: PHP 8.4 x64 nts - Windows PDF backend (experimental)
    runs-on: windows-2022
    continue-on-error: true
    env:
      # Keep in sync with the Linux PDF lane's PDFIO_VERSION in tests.yml.
      PDFIO_VERSION: '1.6.4'
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP SDK
        id: sdk
        # v0.12: determine-revision.ps1 gained Invoke-RestMethod + TLS
        # pinning + ErrorActionPreference=Stop; v0.10's bare
        # Invoke-WebRequest null-deref'd on the releases.json fetch and
        # killed this lane before the build started (run 29160900899).
        uses: php/setup-php-sdk@e2ce1c294f272ed93e8083f14649f5adadf93788 # v0.12
        with:
          version: '8.4'
          arch: x64
          ts: nts
          # The four codec deps config.w32 probes for; the SDK fetches
          # them into the deps prefix (include/ + lib/). pdfio is not
          # available here — it is built and staged in the next step.
          deps: freetype,libpng,libjpeg-turbo,libwebp

      - name: Enable MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ steps.sdk.outputs.toolset }}

      - name: Build pdfio (MSVC) and stage into the SDK deps prefix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # pdfio ships pdfio.vcxproj, which builds pdfio1.dll + its import
          # lib pdfio1.lib for x64 and pulls zlib via NuGet. config.w32
          # accepts pdfio1.lib and searches for headers under
          # <PHP_PHP_BUILD>\include\pdfio. fastchart_pdf.c includes both
          # <pdfio.h> and <pdfio-content.h>, so stage every pdfio header.
          git clone --depth=1 --branch "v$env:PDFIO_VERSION" `
            https://github.com/michaelrsweet/pdfio.git pdfio-src
          Push-Location pdfio-src
          nuget restore pdfio.sln
          msbuild pdfio.vcxproj /p:Configuration=Release /p:Platform=x64
          $lib = Get-ChildItem -Recurse -Filter pdfio1.lib | Select-Object -First 1
          if (-not $lib) { throw "pdfio1.lib was not produced by msbuild" }
          $libdir = $lib.Directory.FullName
          Pop-Location
          # Stage into the deps prefix the SDK reported and, if different,
          # the PHP_PHP_BUILD the phpsdk env exported (config.w32 reads the
          # latter). Place pdfio1.dll on a bin dir so php can load it when
          # php_fastchart.dll pulls it in at runtime.
          $roots = @("${{ steps.sdk.outputs.prefix }}", $env:PHP_PHP_BUILD) |
            Where-Object { $_ } | Select-Object -Unique
          foreach ($root in $roots) {
            New-Item -ItemType Directory -Force -Path "$root\include\pdfio" | Out-Null
            New-Item -ItemType Directory -Force -Path "$root\lib" | Out-Null
            New-Item -ItemType Directory -Force -Path "$root\bin" | Out-Null
            Copy-Item "pdfio-src\*.h" "$root\include\pdfio\" -Force
            Copy-Item "$libdir\pdfio1.lib" "$root\lib\" -Force
            Copy-Item "$libdir\pdfio1.dll" "$root\bin\" -Force -ErrorAction SilentlyContinue
          }

      - name: Build extension with PDF enabled
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          phpize
          # --with-fastchart-pdfio flips config.w32's PDF path on (compiles
          # fastchart_pdf.c); --enable-fastchart-dev holds the /WX bar.
          configure --enable-fastchart --enable-fastchart-dev --with-fastchart-pdfio
          nmake

      - name: Run PDF tests (must execute, not skip)
        shell: pwsh
        run: |
          # 200/201 gate only on pdfio presence (no font needed), mirroring
          # the Linux PDF lane: if the backend linked they run and pass; if
          # pdfio didn't link they SKIP. "Tests passed : 2" is the proof
          # fastchart_pdf.c actually compiled and linked under MSVC.
          $env:PATH = "${{ steps.sdk.outputs.prefix }}\bin;$env:PHP_PHP_BUILD\bin;$env:PATH"
          $env:NO_INTERACTION = "1"
          nmake test TESTS="tests\200_pdf_render_basic.phpt tests\201_pdf_render_to_file.phpt" 2>&1 |
            Tee-Object -FilePath pdf-tests.txt
          if (-not (Select-String -Path pdf-tests.txt -Pattern 'Tests passed\s*:\s*2' -Quiet)) {
            Write-Error "PDF tests did not both pass — pdfio may not have linked (see SKIP reasons above)"
            exit 1
          }

  release:
    name: Attach Windows DLLs to release
    if: github.event_name == 'release'
    needs: windows-build
    runs-on: ubuntu-latest
    # Explicit write scope for releases; default GITHUB_TOKEN is read-only
    # for the contents permission on newly-created repos and the
    # php-windows-builder/release@v1 action calls POST /releases.
    permissions:
      contents: write
    steps:
      # Pinned to the commit SHA that v6 resolves to; this job runs
      # under contents:write, so a moved tag on a third-party action
      # would inherit the release-write token. persist-credentials:
      # false drops the GITHUB_TOKEN from the local git config so any
      # shell step in the workflow cannot reuse it for an unrelated
      # push.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Upload release artifacts
        uses: php/php-windows-builder/release@e03e5d39879adaeb61ed2225f0f4eae7db8c1df8 # v1
        with:
          release: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
