name: Windows Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

permissions: {}

concurrency:
  group: windows-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  windows-matrix:
    name: Generate Windows build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        # Pinned to an immutable release tag's commit SHA: mutable @v1
        # is a supply-chain risk for a workflow that has contents:write
        # on the release job. The comment names the release tag rather
        # than v1, because upstream moves v1 forward and that desyncs
        # the pin from its comment, tripping zizmor ref-version-mismatch.
        # Bump via: gh api repos/php/php-windows-builder/tags
        uses: php/php-windows-builder/extension-matrix@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          extension-url: ${{ github.event.repository.html_url }}
          php-version-list: '8.1, 8.2, 8.3, 8.4, 8.5'

  windows-build:
    name: Build ${{ matrix.php-version }} ${{ matrix.arch }} ${{ matrix.ts }}
    needs: windows-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.windows-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build extension
        uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version: ${{ matrix.php-version }}
          ts: ${{ matrix.ts }}
          arch: ${{ matrix.arch }}
          # extension-matrix flags one lane per (os, VS toolset) pair as
          # the VS-cache saver, and the action's input defaults to true,
          # so forwarding it is what stops all 20 lanes writing the same
          # cache. Our lanes span two toolsets on windows-2022 (vs16 for
          # 8.1-8.3, vs17 for 8.4-8.5), giving 2 savers. Inert as long as
          # the runner ships a toolset in range (14.44 as of run
          # 30447739686): nothing installs, so nothing caches.
          save-vs-cache: ${{ matrix.save-vs-cache }}
          # Tests run in our own step below: the action's test step
          # hardcodes TEST_PHP_ARGS to `-n` + fastchart.dll only, so the
          # ~90 gd round-trip phpts skip, and its test-runner-args input
          # can't inject a gd load — run-tests.php addslashes()es every
          # `-d` value it forwards, mangling Windows paths (run
          # 29161651431 red across all 20 lanes).
          run-tests: 'false'
          # --enable-fastchart-dev turns MSVC warnings into errors (/WX,
          # config.w32:113-117), matching the -Werror bar the Unix lanes
          # hold. This workflow also feeds release publishing (the
          # `release` job below fires on release:published), so /WX now
          # gates release DLLs too: a warning-bearing DLL fails the build
          # and never publishes. That is intended.
          args: --enable-fastchart --enable-fastchart-dev
          # Four pkg-config deps fastchart's config.m4 probes for. The
          # action wires these into the Windows build's vcpkg sysroot so
          # config.m4's PKG_CHECK_MODULES calls resolve. plutovg /
          # plutosvg / qrcodegen are vendored under vendor/ and don't
          # need an entry here.
          libs: freetype,libpng,libjpeg-turbo,libwebp

      - name: Run test suite (gd + fonts enabled)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The action builds under build\<random-guid>\ and moves only
          # artifacts\ back to the workspace; php-bin (the staged test
          # PHP) and the built dll stay in the guid dir. Run from there
          # so runtime dep DLLs resolve exactly as the action's own
          # test step would have them.
          $bdir = Get-ChildItem build -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'php-bin\php.exe') } |
            Select-Object -First 1
          if (-not $bdir) { throw "no build\<guid>\php-bin found — action layout changed?" }
          Set-Location $bdir.FullName
          $ws = (Get-Location).Path
          $php = Join-Path $ws 'php-bin\php.exe'
          $dllItem = Get-ChildItem . -Recurse -Filter php_fastchart.dll |
            Where-Object { $_.FullName -notmatch '\\artifacts\\' } |
            Select-Object -First 1
          if (-not $dllItem) { throw "php_fastchart.dll not found under $ws" }
          $dll = $dllItem.FullName
          # TEST_PHP_ARGS is passed to the test php verbatim (no
          # addslashes mangling, unlike run-tests' -d forwarding), so
          # absolute Windows paths are safe here. php_gd.dll ships in
          # the official Windows test build the action stages under
          # php-bin; loading it turns on the ~90 raster round-trip
          # phpts that otherwise skip on Windows.
          $phpArgs = "-n -d extension=$dll"
          $gd = Join-Path $ws 'php-bin\ext\php_gd.dll'
          if (Test-Path $gd) {
            $phpArgs += " -d extension=$gd"
          } else {
            Get-ChildItem (Join-Path $ws 'php-bin\ext') | Select-Object -ExpandProperty Name
            throw "php_gd.dll not found under php-bin\ext"
          }
          & $php -n -d "extension=$gd" -r `
            'foreach (["imagecreatefromstring", "imagecreatefromjpeg", "imagecreatefromwebp", "imagettftext"] as $f) { if (!function_exists($f)) { fwrite(STDERR, "$f unavailable\n"); exit(1); } }'
          if ($LASTEXITCODE -ne 0) {
            throw "php_gd.dll lacks required PNG/JPEG/WebP/FreeType capabilities"
          }
          $env:TEST_PHP_EXECUTABLE = $php
          $env:TEST_PHP_ARGS = $phpArgs
          $env:REPORT_EXIT_STATUS = '1'
          $env:NO_INTERACTION = '1'
          # tests/_font_candidates.inc only knows Linux font paths; the
          # FC_FONT escape hatch points the ~12 font-gated phpts at a
          # font every Windows runner ships.
          $env:FC_FONT = 'C:\Windows\Fonts\arial.ttf'
          & $php run-tests.php -q --offline --show-diff --set-timeout 120 `
            -g FAIL,XFAIL,BORK,WARN,LEAK -j8 tests/ 2>&1 |
            Tee-Object -FilePath win-tests.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Error "run-tests reported failures (exit $LASTEXITCODE)"
            exit 1
          }
          $skipLine = Select-String -Path win-tests.txt `
            -Pattern 'Tests skipped\s*:\s*(\d+)' | Select-Object -Last 1
          if (-not $skipLine) {
            throw "run-tests summary did not report a skip count"
          }
          $skipped = [int]$skipLine.Matches[0].Groups[1].Value
          Write-Host "Tests skipped: $skipped (expected 30 with gd+fonts loaded: 7 PDF + 15 POSIX/Linux atomic + env-gated)"
          if ($skipped -gt 30) {
            throw "Windows skip count $skipped exceeds ceiling 30"
          }

  # Single representative lane that compiles and tests the MSVC PDF path
  # (fastchart_pdf.c, gated by --with-pdfio in config.w32). No
  # other Windows job exercises it. pdfio is NOT in php-windows-builder's
  # dep catalog, so it is built from source first and handed to the build
  # via LIB / INCLUDE, which config.w32's CHECK_LIB / CHECK_HEADER honor;
  # its runtime DLLs are then staged next to the built extension because
  # PHP >= 7.4 on Windows does not consult %PATH% for extension
  # dependencies. (php/setup-php-sdk was rejected for this lane: its
  # run.ps1 null-derefs in bare Invoke-WebRequest on WinPS 5.1 — upstream
  # bug present at v0.12 and master.) Blocking since run 29162247340 went
  # green (7/7 PDF tests, 0 skips). Not part of release publishing — this
  # lane builds a --with-pdfio DLL that the release job
  # intentionally does not upload (release DLLs are pdfio-less, matching
  # the Linux prebuilt).
  windows-pdf:
    name: PHP 8.4 x64 nts - Windows PDF backend
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Keep in sync with the Linux PDF lane's PDFIO_VERSION in tests.yml.
      PDFIO_VERSION: '1.6.4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable MSVC toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Build pdfio (MSVC) and stage a prefix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # pdfio ships pdfio.vcxproj, which builds pdfio1.dll + its import
          # lib pdfio1.lib for x64 and pulls zlib via NuGet. config.w32
          # accepts pdfio1.lib and searches headers via the INCLUDE env
          # (fastchart_pdf.c includes <pdfio.h> and <pdfio-content.h>, so
          # stage every pdfio header).
          git clone --depth=1 --branch "v$env:PDFIO_VERSION" `
            https://github.com/michaelrsweet/pdfio.git pdfio-src
          Push-Location pdfio-src
          nuget restore pdfio.sln
          msbuild pdfio.vcxproj /p:Configuration=Release /p:Platform=x64
          $lib = Get-ChildItem -Recurse -Filter pdfio1.lib | Select-Object -First 1
          if (-not $lib) { throw "pdfio1.lib was not produced by msbuild" }
          $libdir = $lib.Directory.FullName
          Pop-Location
          $prefix = Join-Path (Get-Location).Path 'pdfio-prefix'
          New-Item -ItemType Directory -Force -Path `
            "$prefix\include\pdfio", "$prefix\lib", "$prefix\bin" | Out-Null
          Copy-Item "pdfio-src\*.h" "$prefix\include\pdfio\" -Force
          Copy-Item "$libdir\pdfio1.lib" "$prefix\lib\" -Force
          $rt = Get-ChildItem $libdir -Filter '*.dll' -ErrorAction SilentlyContinue
          if ($rt) {
            $rt | Copy-Item -Destination "$prefix\bin\" -Force
            Write-Host "pdfio runtime DLLs staged: $($rt.Name -join ', ')"
          } else {
            Write-Host "pdfio produced no runtime DLL (static build) — contents of ${libdir}:"
            Get-ChildItem $libdir | Select-Object -ExpandProperty Name
          }
          # config.w32's CHECK_LIB / CHECK_HEADER_ADD_INCLUDE consult the
          # LIB / INCLUDE env vars; export them for the build action.
          Add-Content $env:GITHUB_ENV "LIB=$prefix\lib;$env:LIB"
          Add-Content $env:GITHUB_ENV "INCLUDE=$prefix\include;$prefix\include\pdfio;$env:INCLUDE"
          Add-Content $env:GITHUB_ENV "PDFIO_PREFIX=$prefix"

      - name: Build extension with PDF enabled
        uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version: '8.4'
          ts: nts
          arch: x64
          # This lane shares (windows-2022, vs17) with an 8.4 matrix lane
          # that is already the designated saver, so restore only.
          save-vs-cache: 'false'
          run-tests: 'false'
          args: --enable-fastchart --enable-fastchart-dev --with-pdfio
          libs: freetype,libpng,libjpeg-turbo,libwebp

      - name: Run PDF tests (must execute, not skip)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Same layout note as the matrix test step: the action builds
          # under build\<guid>\ and leaves php-bin + the dll there.
          $bdir = Get-ChildItem build -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'php-bin\php.exe') } |
            Select-Object -First 1
          if (-not $bdir) { throw "no build\<guid>\php-bin found — action layout changed?" }
          Set-Location $bdir.FullName
          $php = Join-Path $bdir.FullName 'php-bin\php.exe'
          $dllItem = Get-ChildItem . -Recurse -Filter php_fastchart.dll |
            Where-Object { $_.FullName -notmatch '\\artifacts\\' } |
            Select-Object -First 1
          if (-not $dllItem) { throw "php_fastchart.dll not found under $($bdir.FullName)" }
          $dll = $dllItem.FullName
          # PHP >= 7.4 on Windows resolves extension dependencies via the
          # altered DLL search path (the module's own directory), NOT
          # %PATH% — run 29162048084 failed "module could not be found"
          # on an existing dll for exactly this reason. Stage pdfio's
          # runtime DLLs next to the extension and next to php.exe.
          if (Test-Path "$env:PDFIO_PREFIX\bin") {
            Copy-Item "$env:PDFIO_PREFIX\bin\*.dll" (Split-Path $dll) -Force -ErrorAction SilentlyContinue
            Copy-Item "$env:PDFIO_PREFIX\bin\*.dll" (Split-Path $php) -Force -ErrorAction SilentlyContinue
          }
          $env:PATH = "$env:PDFIO_PREFIX\bin;$env:PATH"
          if (Get-Command dumpbin -ErrorAction SilentlyContinue) {
            Write-Host "=== php_fastchart.dll dependencies ==="
            dumpbin /dependents $dll | Out-Host
          }
          $env:TEST_PHP_EXECUTABLE = $php
          $env:TEST_PHP_ARGS = "-n -d extension=$dll"
          $env:REPORT_EXIT_STATUS = '1'
          $env:NO_INTERACTION = '1'
          $env:FC_FONT = 'C:\Windows\Fonts\arial.ttf'
          $pdfTests = Get-ChildItem tests -Filter '*pdf*.phpt' |
            ForEach-Object { "tests/$($_.Name)" }
          Write-Host "PDF tests: $($pdfTests -join ' ')"
          & $php run-tests.php -q --offline --show-diff @pdfTests 2>&1 |
            Tee-Object -FilePath pdf-tests.txt
          $m = Select-String -Path pdf-tests.txt -Pattern 'Tests passed\s*:\s*(\d+)'
          $passed = if ($m) { [int]$m.Matches.Groups[1].Value } else { 0 }
          # Every PDF test must PASS, not skip: a skip here means pdfio
          # didn't link and the lane proved nothing.
          if ($LASTEXITCODE -ne 0 -or $passed -lt $pdfTests.Count) {
            Write-Error "PDF tests: $passed/$($pdfTests.Count) passed — pdfio may not have linked (see SKIPs above)"
            exit 1
          }

  release:
    name: Attach Windows DLLs to release
    if: github.event_name == 'release'
    needs: windows-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Explicit write scope for releases; default GITHUB_TOKEN is read-only
    # for the contents permission on newly-created repos and the
    # php-windows-builder/release@v1 action calls POST /releases.
    permissions:
      contents: write # Uploads Windows binaries to the published release.
    steps:
      # Pinned to the commit SHA that v6 resolves to; this job runs
      # under contents:write, so a moved tag on a third-party action
      # would inherit the release-write token. persist-credentials:
      # false drops the GITHUB_TOKEN from the local git config so any
      # shell step in the workflow cannot reuse it for an unrelated
      # push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload release artifacts
        uses: php/php-windows-builder/release@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          release: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
